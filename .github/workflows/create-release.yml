name: Create Release on PR

on:
    push:
      branches:
        - main

jobs:
  create-release:
    if: |
      contains(github.event.head_commit.message, 'commit new version') == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}
      version: ${{ steps.extract-version.outputs.version }}
      version_number: ${{ steps.extract-version.outputs.version_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract Version
        id: extract-version
        run: |
          # Use grep to find the first occurrence of the version number matching "## v0.0.0" pattern
          version=$(grep -m 1 -oP '## v\d+\.\d+\.\d+' CHANGELOG.md | cut -d ' ' -f 2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Stripped version (no leading v) for the faynoSync server and the embedded binary version
          echo "version_number=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Extract Changelog
        id: extract-changelog
        run: |
          # Extract the content between the last two version headers
          changelog=$(awk '/^## v?[0-9]+\.[0-9]+\.[0-9]+/{if (!version) {version=$0; next}} /^## v?[0-9]+\.[0-9]+\.[0-9]+/{exit} {if (version) description = description ORS $0} END {if (version) print description}' CHANGELOG.md | sed -e '/^## v?[0-9]+\.[0-9]+\.[0-9]+/d; s/^# //' > changelog.txt)
          echo "changelog_file=changelog.txt" >> "$GITHUB_OUTPUT"
          
      - name: Create Release
        id: create-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.extract-version.outputs.version }}
          release_name: ${{ steps.extract-version.outputs.version }}
          body_path: ${{ steps.extract-changelog.outputs.changelog_file }}
          draft: false
          prerelease: false

      - name: Move major tag
        env:
          VERSION: ${{ steps.extract-version.outputs.version }}
        run: |
          # v1.2.3 -> v1 ; keep the floating major tag on the latest release
          major="${VERSION%%.*}"
          git tag -f "$major"
          git push -f origin "$major"

  build-and-upload:
    if: |
      contains(github.event.head_commit.message, 'commit new version') == true
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"
          - os: windows
            arch: arm64
            ext: ".exe"
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.create-release.outputs.version_number }}
          COMMIT: ${{ github.sha }}
          CHANNEL: stable
        run: |
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${BUILD_DATE} -X main.channel=${CHANNEL}" \
            -o "faynosync-cli-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" \
            .

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.release_upload_url }}
          asset_path: ./faynosync-cli-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          asset_name: faynosync-cli-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          asset_content_type: application/octet-stream

  publish-to-faynosync:
    if: |
      contains(github.event.head_commit.message, 'commit new version') == true
    needs: [create-release, build-and-upload]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest,    platform: linux,   arch: amd64, ext: "" }
          - { runner: ubuntu-24.04-arm, platform: linux,   arch: arm64, ext: "" }
          - { runner: macos-latest,     platform: darwin,  arch: amd64, ext: "" }
          - { runner: macos-latest,     platform: darwin,  arch: arm64, ext: "" }
          - { runner: windows-latest,   platform: windows, arch: amd64, ext: ".exe" }
          - { runner: windows-latest,   platform: windows, arch: arm64, ext: ".exe" }

    steps:
      - name: Download release asset and changelog
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ needs.create-release.outputs.version }}" \
            -R ${{ github.repository }} \
            --pattern "faynosync-cli-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}"
          gh release view "${{ needs.create-release.outputs.version }}" \
            -R ${{ github.repository }} \
            --json body -q .body > changelog.txt

      - name: Upload to faynoSync
        uses: ku9nov/faynoSync-cli@main
        with:
          app: faynosync-cli
          file: ./faynosync-cli-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}
          version: ${{ needs.create-release.outputs.version_number }}
          channel: stable
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          publish: true
          changelog-file: ./changelog.txt
          cli-version: ${{ needs.create-release.outputs.version }}
        env:
          FAYNOSYNC_TOKEN: ${{ secrets.FAYNOSYNC_TOKEN }}
          FAYNOSYNC_URL: ${{ secrets.FAYNOSYNC_URL }}
          FAYNOSYNC_ACCOUNT: ${{ secrets.FAYNOSYNC_ACCOUNT }}
